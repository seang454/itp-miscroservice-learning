spring:
  application:
    name: account
  config:
    import: optional:configserver:http://localhost:8888
  profiles:
    active: dev
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090

server:
  port: 20261

eureka:
  instance:
    instance-id: ${spring.application.name}
    prefer-ip-address: true